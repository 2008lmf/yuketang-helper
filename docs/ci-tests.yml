# 想开启 CI，把这个文件复制到 .github/workflows/tests.yml 再推一次即可：
#   mkdir -p .github/workflows && cp docs/ci-tests.yml .github/workflows/tests.yml
# 注意：GitHub 要求 Personal Access Token 具备 workflow 权限才能推送该路径下的文件。
#
# 放在 docs/ 下是因为当前 PAT 没有 workflow scope，直接推 .github/workflows 会被拒绝。
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 跑离线测试
        run: python -m unittest discover -s tests -t . -v
